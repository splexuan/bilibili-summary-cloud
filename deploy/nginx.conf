# ═══════════════════════════════════════════
# bilibili-summary-cloud — Nginx 反向代理
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bsum
#   sudo ln -s /etc/nginx/sites-available/bsum /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：把下面的 your-domain.com 换成你的域名或服务器公网 IP。
# 用 https 时配合 certbot：
#   sudo certbot --nginx -d your-domain.com
# ═══════════════════════════════════════════

# ─── 上游 ───
upstream bsum_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # certbot 会自己加 https 跳转，先留 http 方便首次申请证书
    # 申请完可以取消注释强制跳转：
    # return 301 https://$host$request_uri;

    client_max_body_size 16m;      # 文章粘贴可能较长
    client_body_timeout 60s;

    # ─── 日志 ───
    access_log /var/log/nginx/bsum.access.log;
    error_log  /var/log/nginx/bsum.error.log;

    # ─── 静态资源直出（不过应用）───
    location /static/ {
        alias /opt/bsum/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        alias /opt/bsum/app/static/favicon.svg;
        access_log off;
    }

    # ═══════════════════════════════════════════
    # 【关键】SSE 流式接口必须关缓冲
    #
    # 任务进度（/api/job/{id}/stream）和问答（/api/chat/*）
    # 都走 Server-Sent Events。Nginx 默认会缓冲响应，
    # 导致进度「攒着一次性吐出」甚至根本不出 —— 前端看起来
    # 就是一直卡着不动。这里必须显式关掉。
    # ═══════════════════════════════════════════
    location ~ ^/api/(job/\d+/stream|chat) {
        proxy_pass http://bsum_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ─── 关缓冲（三件套，缺一不可）───
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # ─── 长连接超时（ASR 轮询可能等十几分钟）───
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding on;

        # 不允许任何中间层压缩，否则会把流攒起来
        gzip off;
    }

    # ─── 其余接口 ───
    location / {
        proxy_pass http://bsum_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}

