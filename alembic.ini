# Alembic 配置 — 数据库迁移
#
# 常用命令：
#   生成迁移（模型改动后）：
#       alembic revision --autogenerate -m "描述"
#   应用迁移：
#       alembic upgrade head
#   回退一步：
#       alembic downgrade -1
#   查看当前版本：
#       alembic current
#
# 【注意】URL 由 migrations/env.py 从应用配置读取，此处仅占位。

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# 迁移文件名带时间戳，便于排序
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url 留空，由 env.py 注入
sqlalchemy.url =

[post_write_hooks]
# 迁移生成后可选的格式化钩子，按需开启
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
