<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 · B站视频总结</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/common.css">
<style>
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .app { flex: 1; min-height: 0; }
  .main { min-height: 0; }
  .content { padding: 0; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

  /* 左栏 */
  .kb-side {
    width: 300px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .kb-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .kb-tab {
    flex: 1; padding: 11px 6px; text-align: center; font-size: 12.5px;
    color: var(--ink-500); cursor: pointer; font-weight: 500;
    border-bottom: 2px solid transparent; transition: all .15s;
    user-select: none;
  }
  .kb-tab:hover:not(.active) { color: var(--ink-700); }
  .kb-tab.active { color: var(--amber-700); border-bottom-color: var(--amber-500); }

  .kb-panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .kb-panel.active { display: flex; }

  .kb-search {
    padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .kb-search input { font-size: 12.5px; padding: 6px 10px; }

  .kb-list { flex: 1; overflow-y: auto; padding: 6px; }

  .kb-item {
    display: flex; gap: 9px; padding: 8px 9px; border-radius: var(--radius-sm);
    cursor: pointer; transition: background .13s;
    border-left: 3px solid transparent;
  }
  .kb-item:hover { background: var(--surface-2); }
  .kb-item.active { background: var(--amber-100); border-left-color: var(--amber-500); }

  .kb-thumb {
    width: 52px; aspect-ratio: 16/9; border-radius: 5px; flex-shrink: 0;
    background: var(--ink-100); overflow: hidden;
  }
  .kb-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .kb-doc-icon {
    width: 52px; height: 30px; border-radius: 5px; flex-shrink: 0;
    background: var(--amber-100); color: var(--amber-700);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }

  .kb-info { flex: 1; min-width: 0; }
  .kb-title {
    font-size: 12.5px; font-weight: 500; color: var(--ink-800);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kb-meta { font-size: 11px; color: var(--ink-500); margin-top: 2px; }

  .kb-foot-hint {
    padding: 8px 12px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--ink-500); flex-shrink: 0; text-align: center;
  }

  /* 右栏聊天 */
  .kb-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .kb-scroll { flex: 1; overflow-y: auto; padding: 26px 22px 12px; }
  .kb-inner { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }

  .msg { font-size: 14px; line-height: 1.85; overflow-wrap: break-word; max-width: 100%; }
  .msg.user {
    max-width: 72%; background: var(--amber-100); color: var(--ink-900);
    padding: 11px 16px; border-radius: 16px 16px 4px 16px;
  }
  .msg.ai {
    background: var(--surface); border: 1px solid var(--border);
    padding: 17px 20px; border-radius: 12px; width: 100%;
    box-shadow: var(--shadow-sm);
  }

  .src-box {
    margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--ink-500);
  }
  .src-tag {
    display: inline-block; font-size: 11.5px; padding: 2px 9px;
    background: var(--amber-100); color: var(--amber-700);
    border-radius: 20px; margin: 4px 5px 0 0; cursor: pointer;
    transition: background .13s;
  }
  .src-tag:hover { background: var(--amber-200); }

  .kb-foot-wrap {
    flex-shrink: 0; padding: 12px 22px 18px;
    border-top: 1px solid var(--border); background: var(--bg);
  }
  .kb-foot { max-width: 880px; margin: 0 auto; display: flex; gap: 9px; align-items: flex-end; }
  .kb-foot textarea { flex: 1; min-height: 44px; max-height: 150px; font-size: 13.5px; }

  .md { font-size: 14px; line-height: 1.85; color: var(--ink-800); }
  .md h1 { font-size: 18px; margin: 16px 0 8px; font-weight: 650; }
  .md h2 { font-size: 15.5px; margin: 18px 0 8px; font-weight: 650; padding-left: 9px; border-left: 3px solid var(--amber-400); }
  .md h3 { font-size: 14px; margin: 14px 0 6px; font-weight: 600; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0 8px 21px; }
  .md li { margin: 3px 0; }
  .md code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; color: var(--amber-700); }
  .md pre { background: var(--surface-2); padding: 12px; border-radius: var(--radius-sm); overflow-x: auto; margin: 11px 0; border: 1px solid var(--border); }
  .md pre code { background: none; padding: 0; color: var(--ink-800); }
  .md blockquote { border-left: 3px solid var(--amber-300); padding: 2px 0 2px 12px; margin: 10px 0; color: var(--ink-600); }
  .md table { border-collapse: collapse; margin: 11px 0; font-size: 13px; width: 100%; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; }
  .md th { background: var(--surface-2); font-weight: 600; }
  .md strong { color: var(--ink-900); font-weight: 650; }

  /* 预览弹窗 */
  .pv-head { display: flex; gap: 14px; margin-bottom: 14px; align-items: flex-start; }
  .pv-head img { width: 180px; aspect-ratio: 16/9; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; background: var(--ink-100); }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(20,17,12,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: var(--surface); border-radius: var(--radius-lg);
    border: 1px solid var(--border); width: 100%; max-width: 700px;
    max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-lg);
  }
  .modal-head {
    padding: 15px 20px; border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 600; display: flex;
    justify-content: space-between; align-items: center;
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  .modal-body { padding: 17px 20px; }
  .modal-foot {
    padding: 13px 20px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px;
  }

  @media (max-width: 900px) {
    .kb-side { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <main class="main">
    <header class="topbar">
      <h2>知识库问答</h2>
      <div class="topbar-right">
        <button class="btn btn-sm" id="btn-refresh" onclick="refreshLists()">刷新</button>
        <a href="/" class="btn btn-sm">回工作台</a>
        <button class="btn btn-ghost btn-sm" data-theme-icon onclick="Theme.toggle()">☾</button>
      </div>
    </header>

    <div class="content">
      <div style="display:flex;flex:1;min-height:0">

        <!-- ═══ 左栏 ═══ -->
        <aside class="kb-side">
          <div class="kb-tabs">
            <div class="kb-tab active" data-tab="videos" onclick="switchTab('videos')">视频库</div>
            <div class="kb-tab" data-tab="articles" onclick="switchTab('articles')">文章库</div>
            <div class="kb-tab" data-tab="chats" onclick="switchTab('chats')">历史对话</div>
          </div>

          <div class="kb-panel active" id="panel-videos">
            <div class="kb-search">
              <input type="text" id="v-search" placeholder="搜索标题或 UP 主…">
            </div>
            <div class="kb-list" id="v-list"></div>
            <div class="kb-foot-hint" id="v-count">—</div>
          </div>

          <div class="kb-panel" id="panel-articles">
            <div class="kb-search">
              <input type="text" id="a-search" placeholder="搜索文章标题…">
            </div>
            <div class="kb-list" id="a-list"></div>
            <div class="kb-foot-hint" id="a-count">—</div>
          </div>

          <div class="kb-panel" id="panel-chats">
            <div class="kb-list" id="c-list"></div>
            <div class="kb-foot-hint">点击可载入历史对话</div>
          </div>
        </aside>

        <!-- ═══ 右栏 ═══ -->
        <div class="kb-main">
          <div class="kb-scroll" id="chat-scroll">
            <div class="kb-inner" id="chat-inner"></div>
          </div>

          <div class="kb-foot-wrap">
            <div class="kb-foot">
              <textarea id="q-input" rows="1"
                placeholder="跨全部内容提问，例如：我总结过的内容里，关于成本控制的观点有哪些？"></textarea>
              <button class="btn btn-primary" id="send-btn" onclick="ask()">发送</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<div id="modal-root"></div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/common.js"></script>
<script>
let VIDEOS = [], ARTICLES = [], CHATS = [];
let VQ = '', AQ = '';
let SESS = { id: null, messages: [], busy: false };

const el = id => document.getElementById(id);

// Markdown 渲染由 common.js 的 md() 提供，
// marked 本体走 /static/vendor/marked.min.js（自托管，不依赖外网 CDN）

/* ═══ 初始化 ═══ */

(async function init() {
  try { await API.get('/api/auth/me'); } catch (_) { return; }
  refreshLists();
  paintChat();
})();

function refreshLists() {
  loadVideos();
  loadArticles();
  loadChats();
}

/* ═══ 标签切换 ═══ */

function switchTab(tab) {
  document.querySelectorAll('.kb-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.querySelectorAll('.kb-panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + tab);
  });
}

/* ═══ 视频库 ═══ */

async function loadVideos() {
  const box = el('v-list');
  box.innerHTML = '<div class="empty" style="padding:24px"><div class="spinner"></div></div>';
  try {
    const d = await API.get('/api/videos?page=1&page_size=100');
    VIDEOS = d.items || [];
    el('v-count').textContent = `共 ${d.total} 个视频`;
    paintVideos();
  } catch (ex) {
    box.innerHTML = `<div class="empty" style="padding:24px"><p>${escapeHtml(ex.message)}</p></div>`;
  }
}

function paintVideos() {
  const box = el('v-list');
  const hits = VQ
    ? VIDEOS.filter(v =>
        (v.title || '').toLowerCase().includes(VQ) ||
        (v.uploader || '').toLowerCase().includes(VQ))
    : VIDEOS;

  if (!hits.length) {
    box.innerHTML = `<div class="empty" style="padding:28px 16px">
      <div class="ico">◌</div><h3>${VQ ? '无匹配视频' : '视频库为空'}</h3>
      <p>${VQ ? '换个关键词试试' : '先去工作台总结一些视频'}</p></div>`;
    return;
  }

  box.innerHTML = hits.map(v => `
    <div class="kb-item" data-id="${v.id}" onclick="previewVideo(${v.id})">
      <div class="kb-thumb">
        ${v.thumbnail ? `<img src="${v.thumbnail}" alt="" referrerpolicy="no-referrer">` : ''}
      </div>
      <div class="kb-info">
        <div class="kb-title">${escapeHtml(v.title)}</div>
        <div class="kb-meta">${escapeHtml(v.uploader || '')} · ${v.duration_str || ''}</div>
      </div>
    </div>
  `).join('');
}

el('v-search') && el('v-search').addEventListener('input', e => {
  VQ = (e.target.value || '').toLowerCase().trim();
  paintVideos();
});

/* ═══ 文章库 ═══ */

async function loadArticles() {
  const box = el('a-list');
  box.innerHTML = '<div class="empty" style="padding:24px"><div class="spinner"></div></div>';
  try {
    const d = await API.get('/api/articles?page=1&page_size=100');
    ARTICLES = d.items || [];
    el('a-count').textContent = `共 ${d.total} 篇`;
    paintArticles();
  } catch (ex) {
    box.innerHTML = `<div class="empty" style="padding:24px"><p>${escapeHtml(ex.message)}</p></div>`;
  }
}

function paintArticles() {
  const box = el('a-list');
  const hits = AQ
    ? ARTICLES.filter(a => (a.title || '').toLowerCase().includes(AQ))
    : ARTICLES;

  if (!hits.length) {
    box.innerHTML = `<div class="empty" style="padding:28px 16px">
      <div class="ico">◌</div><h3>${AQ ? '无匹配文章' : '文章库为空'}</h3>
      <p>${AQ ? '换个关键词试试' : '先去工作台粘贴一篇文章'}</p></div>`;
    return;
  }

  box.innerHTML = hits.map(a => `
    <div class="kb-item" data-id="${a.id}" onclick="previewArticle(${a.id})">
      <div class="kb-doc-icon">▤</div>
      <div class="kb-info">
        <div class="kb-title">${escapeHtml(a.title)}</div>
        <div class="kb-meta">${a.processed_at || ''}</div>
      </div>
    </div>
  `).join('');
}

el('a-search') && el('a-search').addEventListener('input', e => {
  AQ = (e.target.value || '').toLowerCase().trim();
  paintArticles();
});

/* ═══ 历史对话 ═══ */

async function loadChats() {
  const box = el('c-list');
  box.innerHTML = '<div class="empty" style="padding:24px"><div class="spinner"></div></div>';
  try {
    const d = await API.get('/api/chat/history');
    CHATS = d.items || [];
    paintChats();
  } catch (ex) {
    box.innerHTML = `<div class="empty" style="padding:24px"><p>${escapeHtml(ex.message)}</p></div>`;
  }
}

function paintChats() {
  const box = el('c-list');
  if (!CHATS.length) {
    box.innerHTML = `<div class="empty" style="padding:28px 16px">
      <div class="ico">◌</div><h3>暂无对话</h3><p>提问后会自动保存</p></div>`;
    return;
  }

  box.innerHTML = CHATS.map(c => `
    <div class="kb-item ${SESS.id === c.id ? 'active' : ''}" onclick="loadSession(${c.id})">
      <div class="kb-info">
        <div class="kb-title">${escapeHtml(c.title || '未命名对话')}</div>
        <div class="kb-meta">${c.message_count} 条 · ${c.created_at || ''}</div>
      </div>
      <button class="btn btn-ghost btn-sm" style="flex-shrink:0"
        onclick="event.stopPropagation();delSession(${c.id})">✕</button>
    </div>
  `).join('');
}

async function loadSession(id) {
  try {
    const d = await API.get(`/api/chat/history/${id}`);
    SESS = {
      id: d.id,
      busy: false,
      messages: (d.messages || []).map(m => ({
        role: m.role,
        content: m.content,
        rendered: m.role === 'assistant' ? md(m.content) : '',
      })),
    };
    paintChats();
    paintChat();
  } catch (ex) { err(ex.message); }
}

async function delSession(id) {
  if (!confirm('删除这条对话记录？')) return;
  try {
    await API.del(`/api/chat/history/${id}`);
    if (SESS.id === id) { SESS = { id: null, messages: [], busy: false }; paintChat(); }
    ok('已删除');
    loadChats();
  } catch (ex) { err(ex.message); }
}

/* ═══ 预览 ═══ */

async function previewVideo(id) {
  try {
    const d = await API.get(`/api/videos/${id}`);
    document.querySelectorAll('.kb-item').forEach(i => i.classList.remove('active'));
    const item = document.querySelector(`.kb-item[data-id="${id}"]`);
    if (item) item.classList.add('active');

    showModal({
      title: d.title || '视频详情',
      buttons: [{ text: '关闭', onclick: 'closeModal()' }],
      body: `
        <div class="pv-head">
          ${d.thumbnail ? `<img src="${d.thumbnail}" alt="" referrerpolicy="no-referrer">` : '<div style="width:180px;aspect-ratio:16/9;border-radius:9px;background:var(--ink-100);flex-shrink:0"></div>'}
          <div style="flex:1;min-width:0">
            <div class="text-xs muted mb-1">${escapeHtml(d.uploader || '')} · ${d.duration_str || ''}</div>
            <div class="text-xs muted mb-2">
              文字稿来源：${d.transcript_source === 'asr' ? '语音识别' : d.has_transcript ? '视频字幕' : '无'}
            </div>
            ${d.url ? `<a href="${escapeHtml(d.url)}" target="_blank" class="text-xs">打开原视频 ↗</a>` : ''}
            <div class="mt-2">
              <button class="btn btn-sm" onclick="closeModal();askAbout('video', ${d.id}, '${escapeAttr(d.title)}')">
                就此视频提问
              </button>
            </div>
          </div>
        </div>
        <div class="md" style="font-size:13.5px">${
          d.summary ? md(d.summary) : '<div class="muted text-sm">暂无 AI 总结</div>'
        }</div>`,
    });
  } catch (ex) { err(ex.message); }
}

async function previewArticle(id) {
  try {
    const d = await API.get(`/api/articles/${id}`);
    document.querySelectorAll('.kb-item').forEach(i => i.classList.remove('active'));
    const item = document.querySelector(`.kb-item[data-id="${id}"]`);
    if (item) item.classList.add('active');

    showModal({
      title: d.title || '文章详情',
      buttons: [{ text: '关闭', onclick: 'closeModal()' }],
      body: `
        <div class="text-xs muted mb-2">
          ${d.processed_at ? '处理于 ' + d.processed_at : ''}
          ${d.url ? ` · <a href="${escapeHtml(d.url)}" target="_blank">原文 ↗</a>` : ''}
        </div>
        <div class="mb-2">
          <button class="btn btn-sm"
            onclick="closeModal();askAbout('article', ${d.id}, '${escapeAttr(d.title)}')">
            就此文章提问
          </button>
        </div>
        <div class="md" style="font-size:13.5px">${
          d.summary ? md(d.summary) : '<div class="muted text-sm">暂无 AI 总结</div>'
        }</div>`,
    });
  } catch (ex) { err(ex.message); }
}

function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

/* ═══ 聊天 ═══ */

function paintChat() {
  const box = el('chat-inner');
  if (!SESS.messages.length) {
    box.innerHTML = `<div class="empty" style="padding:80px 20px">
      <div class="ico">◐</div>
      <h3>知识库问答</h3>
      <p style="max-width:460px;margin:8px auto 0;line-height:1.75">
        对所有已总结的视频与文章提问。系统会先在你的知识库里粗筛相关内容，
        再对命中内容做原文精读，最后交给 AI 综合作答。
      </p>
    </div>`;
    return;
  }

  box.innerHTML = SESS.messages.map(m => {
    if (m.role === 'system') return '';
    if (m.role === 'user') {
      return `<div class="msg-row user"><div class="msg user">${escapeHtml(m.content)}</div></div>`;
    }
    return `<div class="msg-row"><div class="msg ai">
      <div class="md">${m.rendered || md(m.content)}</div>
      ${m.sources && m.sources.length ? renderSources(m.sources) : ''}
    </div></div>`;
  }).join('');

  const sc = el('chat-scroll');
  sc.scrollTop = sc.scrollHeight;
}

function renderSources(sources) {
  const tags = sources.map(s => {
    const fn = s.type === 'article'
      ? `previewArticle(${s.id})`
      : `previewVideo(${s.id})`;
    return `<span class="src-tag" onclick="${fn}">${escapeHtml(s.title)}</span>`;
  }).join('');
  return `<div class="src-box">
    <div class="mb-1">参考内容</div>${tags}
  </div>`;
}

function askAbout(kind, id, title) {
  SESS = { id: null, messages: [], busy: false };
  switchTab('videos');
  ask(`请介绍一下《${title}》的核心内容。`);
}

async function ask(preset) {
  const inp = el('q-input');
  const q = (typeof preset === 'string' ? preset : (inp.value || '')).trim();
  if (!q) { inp.focus(); return; }
  if (SESS.busy) { toast('上一条还在回答中'); return; }

  inp.value = '';
  inp.style.height = 'auto';

  SESS.messages.push({ role: 'user', content: q });
  paintChat();

  const box = el('chat-inner');
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `<div class="msg ai"><div class="text-sm muted">
    <span class="spinner"></span> 正在检索知识库…</div></div>`;
  box.appendChild(row);
  el('chat-scroll').scrollTop = el('chat-scroll').scrollHeight;

  SESS.busy = true;
  el('send-btn').disabled = true;

  let acc = '', sources = null;

  try {
    const resp = await fetch('/api/chat/kb', {
      method: 'POST',
      headers: API.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        messages: SESS.messages
          .filter(m => m.role !== 'system')
          .slice(-10)
          .map(m => ({ role: m.role, content: m.content })),
      }),
    });

    if (resp.status === 401) { API.setToken(''); location.href = '/login'; return; }
    if (!resp.ok) {
      let msg = `请求失败 (${resp.status})`;
      try { const j = await resp.json(); msg = j.message || msg; } catch (_) {}
      throw new Error(msg);
    }

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const blocks = buf.split('\n\n');
      buf = blocks.pop() || '';

      for (const block of blocks) {
        const evM = block.match(/^event:\s*(.+)$/m);
        const dM = block.match(/^data:\s*(.+)$/m);
        if (!dM) continue;
        const ev = evM ? evM[1].trim() : 'message';

        let data;
        try { data = JSON.parse(dM[1]); } catch (_) { continue; }

        if (ev === 'sources') {
          sources = data.sources || [];
        } else if (ev === 'delta') {
          acc += data.text || '';
          row.innerHTML = `<div class="msg ai"><div class="md">${md(acc)}</div></div>`;
          el('chat-scroll').scrollTop = el('chat-scroll').scrollHeight;
        } else if (ev === 'error') {
          throw new Error(data.message || '回答失败');
        }
      }
    }

    if (!acc) acc = '（没有返回内容）';

    SESS.messages.push({
      role: 'assistant', content: acc, rendered: md(acc), sources,
    });
    paintChat();

    // 只有知识库问答会落库（单内容问答在 /api/chat/video 里按需保存）
    try {
      const r = await API.post('/api/chat/history', {
        chat_id: SESS.id,
        kind: 'kb',
        title: SESS.messages[0].content.slice(0, 30),
        messages: SESS.messages.map(m => ({ role: m.role, content: m.content })),
      });
      SESS.id = r.id;
      loadChats();
    } catch (_) {}
  } catch (ex) {
    row.innerHTML = `<div class="msg ai"><div style="color:var(--red-500);font-size:13px">
      ${escapeHtml(ex.message)}</div></div>`;
  } finally {
    SESS.busy = false;
    const b = el('send-btn');
    if (b) b.disabled = false;
    const i2 = el('q-input');
    if (i2) { i2.focus(); }
  }
}

const qInp = el('q-input');
qInp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
qInp.addEventListener('input', () => {
  qInp.style.height = 'auto';
  qInp.style.height = Math.min(qInp.scrollHeight, 150) + 'px';
});

/* ═══ 弹窗 ═══ */

function showModal({ title, body, buttons = [] }) {
  const root = el('modal-root');
  root.innerHTML = `
    <div class="modal-mask" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">
          <span class="truncate" style="padding-right:12px">${escapeHtml(title)}</span>
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        ${buttons.length ? `<div class="modal-foot">${
          buttons.map((b, i) => `<button class="btn" data-mi="${i}">${escapeHtml(b.text)}</button>`).join('')
        }</div>` : ''}
      </div>
    </div>`;
  buttons.forEach((b, i) => {
    const bEl = root.querySelector(`[data-mi="${i}"]`);
    if (bEl) bEl.onclick = () => new Function(b.onclick)();
  });
}

function closeModal() {
  el('modal-root').innerHTML = '';
}
</script>
