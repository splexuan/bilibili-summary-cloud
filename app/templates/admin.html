<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · B站视频总结工具</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  .kv { display: flex; flex-direction: column; gap: 2px; }
  .kv .k { font-size: 11.5px; color: var(--ink-500); }
  .kv .v { font-size: 13px; font-family: var(--mono); color: var(--ink-900); }

  .setting-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .setting-item:last-child { border-bottom: none; padding-bottom: 0; }

  /*
   * 左侧文字区
   *
   * 这里的 min-width 是关键：默认 min-width:auto 会让 flex 子项
   * 无法收缩到内容宽度以下，但同时 .setting-input 的 width:100%
   * （来自 common.css 的 input[type=text]）会抢走全部空间，
   * 把本区挤成 1 字宽 —— 表现就是中文标签「竖排成一行一个字」。
   * 所以此处显式给一个可读的最小宽度 + 允许内部换行。
   */
  .setting-info {
    flex: 1 1 auto;
    min-width: 220px;
    overflow-wrap: anywhere;
  }
  .setting-info .name {
    font-size: 13px;
    color: var(--ink-800);
    font-weight: 500;
    line-height: 1.5;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  /* 标签文字本身不该被拆行，短标签保持一行更整齐 */
  .setting-info .name .txt { min-width: 0; }
  .setting-info .desc {
    font-size: 11.5px;
    color: var(--ink-500);
    margin-top: 2px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  /*
   * 右侧输入框
   *
   * 必须覆盖 common.css 里的 `input[type="text"] { width: 100% }`，
   * 否则它会按「卡片宽度的 100%」撑开，配合 flex-shrink:0 就把左边挤扁。
   * 用 flex-basis 固定基准宽度、允许收缩，比写 width 更稳。
   */
  .setting-input {
    flex: 0 1 260px;
    width: auto;
    min-width: 140px;
    max-width: 260px;
  }
  /* 窄屏时改为上下堆叠，避免互相挤压 */
  @media (max-width: 720px) {
    .setting-item { flex-direction: column; align-items: stretch; gap: 8px; }
    .setting-info { min-width: 0; }
    .setting-input { flex: 1 1 auto; max-width: none; width: 100%; }
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .status-dot.on { background: var(--green-600); }
  .status-dot.off { background: var(--ink-300); }
  .status-dot.err { background: var(--red-500); }

  .region-warn {
    background: #FFF8E6;
    border: 1px solid #F0DCA8;
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    font-size: 12.5px;
    color: #8A5A12;
    line-height: 1.65;
  }
  [data-theme="dark"] .region-warn {
    background: #2B2416;
    border-color: #4A3E20;
    color: #E0BC72;
  }

  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(20, 17, 12, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 440px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }

  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-body { padding: 18px 20px; }
  .modal-foot {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .pwd-reveal {
    background: var(--amber-100);
    border: 1px dashed var(--amber-400);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--amber-700);
    margin-top: 10px;
    word-break: break-all;
    text-align: center;
    user-select: all;
  }

  /* 放整条邀请链接时用：14px 的等宽字会让 URL 折成三四行，缩小并左对齐更好读 */
  .pwd-reveal.link {
    font-size: 11.5px;
    line-height: 1.7;
    text-align: left;
  }

  .tab-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* ─── 详情弹窗：宽版 ─── */
  /*
   * .modal 默认 max-width:440px，配合 .grid-2 的 minmax(300px,1fr)
   * 在 400px 可用宽度里只排得下 1 列 —— 元信息会一路竖着堆下来。
   * 详情页内容多，单独给个宽版。
   */
  .modal-wide { max-width: 860px; }

  /*
   * .modal 默认 overflow-y:auto，标题栏和底部按钮会跟着内容一起滚走。
   * 详情内容很长，改成 flex 列布局后只让 .modal-body 滚。
   * min-height:0 不能省：flex 子项默认 min-height:auto，会被内容撑开，
   * 那样 overflow 永远不触发（同 .scroll-body 的坑）。
   */
  .modal-fill { display: flex; flex-direction: column; overflow: hidden; }
  .modal-fill .modal-body { flex: 1; min-height: 0; overflow-y: auto; }

  /* 头部：封面 + 标题 + 标签 */
  .vd-head { display: flex; gap: 14px; align-items: flex-start; }

  .vd-thumb {
    width: 136px;
    aspect-ratio: 16 / 9;
    flex-shrink: 0;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--ink-100);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-400);
    font-size: 11px;
  }
  .vd-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .vd-headmain { flex: 1; min-width: 0; }
  .vd-title {
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.55;
    color: var(--ink-900);
    margin-bottom: 9px;
    /* 投稿标题经常长到离谱，最多给 3 行，再多就省略 */
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .vd-badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .vd-link {
    margin-top: 9px;
    font-size: 11.5px;
    font-family: var(--mono);
    color: var(--ink-500);
    overflow-wrap: anywhere;
  }

  /* 元信息：自适应多列，用 1px 背景做分隔线（深浅色主题都不用另写） */
  .vd-meta {
    display: grid;
    gap: 1px;
    margin: 16px 0;
    grid-template-columns: repeat(auto-fit, minmax(172px, 1fr));
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .vd-meta-item { background: var(--surface); padding: 9px 12px; min-width: 0; }
  .vd-meta-item .k {
    display: block;
    font-size: 11px;
    color: var(--ink-500);
    margin-bottom: 3px;
  }
  .vd-meta-item .v {
    display: block;
    font-size: 12.5px;
    color: var(--ink-900);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 内容面板：转写 / 总结 */
  .vd-panel {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .vd-panel + .vd-panel { margin-top: 12px; }

  .vd-panel-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .vd-panel-title { font-size: 12.5px; font-weight: 600; color: var(--ink-800); }
  .vd-chip {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--ink-500);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1px 8px;
  }
  .vd-copy { margin-left: auto; flex-shrink: 0; }

  /*
   * 转写面板：内容动辄几千字，且主要是排查时才看，固定高度内部滚动。
   * 高度压得比较矮是有意的 —— 它一高，「总结」就被挤到看不见了。
   * overscroll-behavior 防止滚到底后继续带动外层 modal-body。
   *
   * 174px 是算出来的，不是随手写的：
   *   滚动容器的可视裁剪边界是「内边距盒」，不是内容盒 ——
   *   padding-bottom 只让滚到底时多留 12px 呼吸空间，
   *   并不会在默认（未滚动）状态下把下边界往上收。
   *   所以真正能放下的内容高度 = 内边距盒高度 - padding-top
   *                              = 174 - 12 = 162px
   *   而 .vd-transcript 一行是 12.5px × 1.85 = 23.125px，
   *   162 / 23.125 = 7 行整，第 8 行正好落在裁剪线之外。
   *
   *   之前写 186px 时多出 10px，第 8 行的字顶会露出 4px，
   *   看起来像「内容被渲染截断」—— 实际是没对齐到行边界。
   */
  .vd-panel-body {
    padding: 12px 14px;
    max-height: 174px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  /*
   * 总结面板：主内容，不设高度上限，让它自然铺开，
   * 由外层 modal-body 统一滚动（避免「滚动区里套滚动区」）。
   */
  .vd-panel-body.vd-flow { max-height: none; overflow: visible; }

  /* 转写是纯文本：保留换行，用无衬线字体比等宽更好读 */
  .vd-transcript {
    font-family: var(--font);
    font-size: 12.5px;
    line-height: 1.85;
    color: var(--ink-700);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .vd-note { margin-top: 9px; font-size: 11px; color: var(--amber-700); }

  /* ─── Markdown 渲染（总结正文） ─── */
  /*
   * 前台 index.html / knowledge.html 各自带了一份 .md 样式，本页此前完全没有，
   * 直接 md() 出来会是没有任何排版的裸 HTML（标题、加粗都看不出来）。
   * 这里补一份给管理端用；本页只此一处用到 .md，不会外溢。
   */
  .md { font-size: 13px; line-height: 1.8; color: var(--ink-800); word-wrap: break-word; }
  .md h1 { font-size: 16px; margin: 16px 0 8px; font-weight: 650; color: var(--ink-900); }
  .md h2 {
    font-size: 14.5px; margin: 18px 0 8px; font-weight: 650; color: var(--ink-900);
    padding-left: 9px; border-left: 3px solid var(--amber-400);
  }
  .md h3 { font-size: 13.5px; margin: 14px 0 6px; font-weight: 600; color: var(--ink-800); }
  .md h4 { font-size: 13px; margin: 12px 0 5px; font-weight: 600; color: var(--ink-700); }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0 8px 21px; }
  .md li { margin: 3px 0; }
  .md code {
    background: var(--surface-2); padding: 2px 6px; border-radius: 4px;
    font-family: var(--mono); font-size: 12px; color: var(--amber-700);
  }
  .md pre {
    background: var(--surface-2); padding: 12px; border-radius: var(--radius-sm);
    overflow-x: auto; margin: 11px 0; border: 1px solid var(--border);
  }
  .md pre code { background: none; padding: 0; color: var(--ink-800); }
  .md blockquote {
    border-left: 3px solid var(--amber-300); padding: 2px 0 2px 12px;
    margin: 10px 0; color: var(--ink-600);
  }
  .md table { border-collapse: collapse; margin: 11px 0; font-size: 12.5px; width: 100%; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; }
  .md th { background: var(--surface-2); font-weight: 600; }
  .md strong { color: var(--ink-900); font-weight: 650; }
  .md a { color: var(--amber-600); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 15px 0; }

  /* 窄屏：封面铺满、元信息退成单列、转写再矮一点 */
  @media (max-width: 560px) {
    .vd-head { flex-direction: column; }
    .vd-thumb { width: 100%; }
    /* 窄屏放 6 行：151 - 12 = 139 ≈ 6 × 23.125 = 138.75，同样不露半截 */
    .vd-panel-body { max-height: 151px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ═══ 侧边栏 ═══ -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>管理后台</h1>
      <div class="ver">bilibili-summary-cloud</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="overview" onclick="go('overview')">
        <span class="ico">◫</span> 概览
      </div>
      <div class="nav-item" data-page="config" onclick="go('config')">
        <span class="ico">⚙</span> 密钥配置
      </div>
      <div class="nav-item" data-page="users" onclick="go('users')">
        <span class="ico">◉</span> 用户管理
      </div>
      <div class="nav-item" data-page="invites" onclick="go('invites')">
        <span class="ico">✉</span> 邀请码
      </div>
      <div class="nav-item" data-page="videos" onclick="go('videos')">
        <span class="ico">▤</span> 视频数据
      </div>
      <div class="nav-item" data-page="articles" onclick="go('articles')">
        <span class="ico">▧</span> 文章数据
      </div>
      <div class="nav-item" data-page="jobs" onclick="go('jobs')">
        <span class="ico">⇄</span> 任务队列
      </div>
      <div class="nav-item" data-page="usage" onclick="go('usage')">
        <span class="ico">◐</span> 用量统计
      </div>
    </nav>

  </aside>

  <!-- ═══ 主区 ═══ -->
  <main class="main">
    <header class="topbar">
      <h2 id="page-title">概览</h2>
      <div class="topbar-right">
        <nav class="topbar-links">
          <a href="/">去前台</a>
          <a href="#" onclick="logout();return false">退出</a>
        </nav>
        <span id="whoami" class="topbar-user">—</span>
        <button class="btn btn-ghost btn-sm" data-theme-icon onclick="Theme.toggle()">☾</button>
      </div>
    </header>

    <div class="content" id="content">
      <div class="empty"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<div id="modal-root"></div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/common.js"></script>
<script>
let ME = null;
let CURRENT = 'overview';
const STATE = { page: {} };

const TITLES = {
  overview: '概览', config: '密钥配置', users: '用户管理',
  invites: '邀请码', videos: '视频数据', articles: '文章数据',
  jobs: '任务队列', usage: '用量统计',
};

/* ═══ 路由 ═══ */

function go(page) {
  CURRENT = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.getElementById('page-title').textContent = TITLES[page] || page;
  history.replaceState(null, '', '#' + page);
  render();
}

async function render() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  try {
    await PAGES[CURRENT]();
  } catch (ex) {
    c.innerHTML = `<div class="empty">
      <div class="ico">⚠</div><h3>加载失败</h3><p>${escapeHtml(ex.message)}</p>
    </div>`;
  }
}

/* ═══ 概览 ═══ */

const PAGES = {};

PAGES.overview = async () => {
  const d = await API.get('/api/admin/overview');
  const q = d.queue || {};

  document.getElementById('content').innerHTML = `
    <div class="grid grid-3 mb-2">
      <div class="stat">
        <div class="stat-label">用户</div>
        <div class="stat-value">${d.users.active}</div>
        <div class="stat-sub">共 ${d.users.total} 个账号</div>
      </div>
      <div class="stat">
        <div class="stat-label">视频</div>
        <div class="stat-value">${d.content.videos}</div>
        <div class="stat-sub">文章 ${d.content.articles} 篇</div>
      </div>
      <div class="stat">
        <div class="stat-label">任务</div>
        <div class="stat-value">${d.jobs.running}</div>
        <div class="stat-sub">排队 ${d.jobs.pending} · 失败 ${d.jobs.error}</div>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-head"><div class="card-title"><span class="dot"></span> 任务队列</div></div>
        <div class="grid grid-3" style="gap:10px">
          <div><div class="kv"><span class="k">排队中</span><span class="v">${q.queued ?? '—'}</span></div></div>
          <div><div class="kv"><span class="k">执行中</span><span class="v">${q.started ?? '—'}</span></div></div>
          <div><div class="kv"><span class="k">失败</span><span class="v">${q.failed ?? '—'}</span></div></div>
        </div>
        <button class="btn btn-sm mt-2" onclick="requeue()">重排失败任务</button>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title"><span class="dot"></span> 正在执行</div></div>
        <div id="online-list"><div class="muted text-sm">加载中…</div></div>
      </div>
    </div>
  `;

  loadOnline();
};

async function loadOnline() {
  const box = document.getElementById('online-list');
  try {
    const d = await API.get('/api/admin/online');
    if (!d.items.length) {
      box.innerHTML = '<div class="muted text-sm">当前没有正在执行的任务</div>';
      return;
    }
    box.innerHTML = d.items.map(u => `
      <div class="row-between" style="padding:6px 0">
        <span class="text-sm">${escapeHtml(u.username)}</span>
        <span class="text-xs muted">${u.jobs.map(j => j.type + ' · ' + j.status).join('，')}</span>
      </div>
    `).join('');
  } catch (_) {
    box.innerHTML = '<div class="muted text-sm">读取失败</div>';
  }
}

async function requeue() {
  try {
    const r = await API.post('/api/admin/queue/requeue', {});
    ok(r.message);
    render();
  } catch (ex) { err(ex.message); }
}

/* ═══ 密钥配置 ═══ */

PAGES.config = async () => {
  const d = await API.get('/api/admin/settings');
  const groups = {
    'AI 服务': ['deepseek_api_url', 'deepseek_model', 'deepseek_api_key', 'allow_user_own_key'],
    '腾讯云语音识别': ['asr_secret_id', 'asr_secret_key', 'asr_region', 'asr_engine', 'asr_monthly_quota_sec'],
    '腾讯云对象存储': ['cos_secret_id', 'cos_secret_key', 'cos_region', 'cos_bucket', 'cos_domain'],
    '下载与代理': ['http_proxy', 'global_bili_cookie', 'ffmpeg_path'],
    '业务开关': ['enable_asr', 'share_summary_across_users', 'registration_open', 'site_notice'],
  };
  const byKey = {};
  d.items.forEach(i => byKey[i.key] = i);

  let html = `
    <div class="card">
      <div class="card-desc">
        修改后立即生效，无需重启服务。密钥类配置以密文存储，
        页面仅显示脱敏值，留空表示不修改。
      </div>
      <div class="row wrap" style="gap:8px">
        <button class="btn btn-sm" onclick="testConn('asr')">测试语音识别</button>
        <button class="btn btn-sm" onclick="testConn('cos')">测试对象存储</button>
        <button class="btn btn-sm" onclick="testConn('deepseek')">测试 AI 服务</button>
        <button class="btn btn-sm" onclick="checkRegion()">检查地域一致性</button>
      </div>
      <div id="test-result" class="mt-2"></div>
    </div>
  `;

  for (const [group, keys] of Object.entries(groups)) {
    const rows = keys.map(k => {
      const item = byKey[k];
      if (!item) return '';
      const src = item.source === 'env' ? '（来自环境变量）' : '';
      return `
        <div class="setting-item" data-key="${k}">
          <div class="setting-info">
            <div class="name"><span class="status-dot ${item.is_set ? 'on' : 'off'}"></span><span class="txt">${escapeHtml(item.description)}</span></div>
            <div class="desc mono">${k} ${src}</div>
          </div>
          <input class="setting-input ${item.is_secret ? 'secret' : ''}"
                 data-key="${k}"
                 placeholder="${item.is_set ? escapeHtml(item.value) : '未配置'}"
                 type="text">
        </div>`;
    }).join('');

    html += `
      <div class="card">

    ok(r.message);
    render();
  } catch (ex) { err(ex.message); }
}

/* ═══ 邀请码 ═══ */

/* 缓存一份列表，复制按钮只传 id，避免把邀请码拼进 onclick 属性里 */
let INVITES = [];

/**
 * 邀请链接：用当前访问的 origin 拼，这样部署在任意域名/端口下都自动正确。
 * 注册页会读取 invite 参数自动回显并切到注册 tab。
 */
function inviteLink(code) {
  return `${location.origin}/login?invite=${encodeURIComponent(code)}`;
}

/**
 * 判断当前是不是用本机/内网地址打开的后台。
 * 这种地址拼出来的链接对别人是打不开的（127.0.0.1 指向对方自己的机器），
 * 复制的瞬间提醒一句，省得对方反馈「链接打不开」时还要来回排查。
 */
function isLocalHostname(host) {
  return host === 'localhost' || host === '127.0.0.1' || host === '::1'
    || host === '' || /^10\./.test(host)
    || /^192\.168\./.test(host) || /^172\.(1[6-9]|2\d|3[01])\./.test(host);
}

async function copyInviteLink(id) {
  const row = INVITES.find(x => x.id === id);
  if (!row) return err('列表已过期，请刷新页面重试');

  const url = inviteLink(row.code);
  const copied = await copyText(url);
  if (!copied) {
    // HTTP 部署下 execCommand 兜底也可能被浏览器策略挡掉，提示手动选中
    return err('复制失败，请到「邀请码」列手动选中链接');
  }

  if (isLocalHostname(location.hostname)) {
    err(`已复制，但地址是 ${location.hostname}，对方打不开；请改用公网域名访问后台再复制`);
  } else {
    ok('邀请链接已复制，对方点开会自动填好邀请码');
  }
}

async function viewVideo(id) {
  const v = await API.get(`/api/admin/videos/${id}`);

  const ts = v.transcript || '';
  const sm = v.summary || '';

  // 转写可能上万字，DOM 里塞全量意义不大（下面有「复制」拿完整内容）
  const TS_LIMIT = 20000;
  const truncated = ts.length > TS_LIMIT;

  // 完整原文挂在 window 上，按钮按 key 取 —— 长文本塞进 onclick 属性
  // 要处理引号/换行转义，很容易拼错
  window.__vdText = { transcript: ts, summary: sm };

  const SRC = {
    asr: ['语音识别', 'badge-blue'],
    subtitle: ['字幕', 'badge-green'],
  };
  const [srcLabel, srcCls] = SRC[v.transcript_source] || ['未记录', 'badge-gray'];

  const badges = [
    `<span class="badge ${srcCls}">${srcLabel}</span>`,
    v.platform ? `<span class="badge badge-gray">${escapeHtml(v.platform)}</span>` : '',
    v.duration_str ? `<span class="badge badge-gray">${escapeHtml(v.duration_str)}</span>` : '',
    sm ? `<span class="badge badge-amber">总结 ${sm.length} 字</span>`
       : `<span class="badge badge-red">未生成总结</span>`,
    v.reused ? `<span class="badge badge-gray">复用他人结果</span>` : '',
  ].filter(Boolean).join('');

  // title 属性放完整值：.v 是单行省略，长 ID 会被截断
  const metaItem = (k, val, mono) => `
    <div class="vd-meta-item">
      <span class="k">${k}</span>
      <span class="v${mono ? ' mono' : ''}" title="${escapeHtml(val || '')}">${escapeHtml(val || '—')}</span>
    </div>`;

  const link = v.url
    ? `<div class="vd-link">🔗 <a href="${escapeHtml(v.url)}" target="_blank" rel="noopener">${escapeHtml(v.url)}</a></div>`
    : '';

  showModal('视频详情', `
    <div class="vd-head">
      <div class="vd-thumb">
        ${(v.thumbnail_small || v.thumbnail) ? thumbTag(v.thumbnail_small, v.thumbnail, 'alt="封面" loading="lazy"') : '<span>无封面</span>'}
      </div>
      <div class="vd-headmain">
        <div class="vd-title">${escapeHtml(v.title || '（无标题）')}</div>
        <div class="vd-badges">${badges}</div>
        ${link}
      </div>
    </div>

    <div class="vd-meta">
      ${metaItem('UP主', v.uploader)}
      ${metaItem('所属用户', v.owner)}
      ${metaItem('视频 ID', v.vid, true)}
      ${metaItem('处理时间', v.processed_at)}
    </div>

    <div class="vd-panel">
      <div class="vd-panel-head">
        <span class="vd-panel-title">原文转写</span>
        <span class="vd-chip">${ts.length} 字</span>
        ${ts ? `<button class="btn btn-sm vd-copy" onclick="vdCopy('transcript')">复制</button>` : ''}
      </div>
      <div class="vd-panel-body">
        ${ts
          ? `<div class="vd-transcript">${escapeHtml(ts.slice(0, TS_LIMIT))}</div>`
          : '<div class="text-sm muted">（无转写内容）</div>'}
        ${truncated ? `<div class="vd-note">仅显示前 ${TS_LIMIT} 字，完整内容请点「复制」</div>` : ''}
      </div>
    </div>

    <div class="vd-panel">
      <div class="vd-panel-head">
        <span class="vd-panel-title">AI 总结</span>
        <span class="vd-chip">${sm.length} 字</span>
        ${sm ? `<button class="btn btn-sm vd-copy" onclick="vdCopy('summary')">复制</button>` : ''}
      </div>
      <div class="vd-panel-body vd-flow">
        ${sm ? `<div class="md">${md(sm)}</div>` : '<div class="text-sm muted">（尚未生成总结）</div>'}
      </div>
    </div>
  `, null, '关闭', { wide: true, fill: true });
}

async function vdCopy(key) {
  const text = (window.__vdText || {})[key] || '';
  if (!text) return err('没有可复制的内容');
  if (await copyText(text)) toast('已复制到剪贴板');
  else err('复制失败，请手动选择文本');
}

      <td><div class="truncate" style="max-width:400px">${escapeHtml(a.title)}</div></td>
      <td class="text-sm">${escapeHtml(a.username)}</td>
      <td class="text-sm">${a.summary_len ? `<span class="badge badge-green">${a.summary_len} 字</span>` : '<span class="badge badge-gray">无</span>'}</td>
      <td class="text-xs muted">${a.processed_at}</td>
      <td><button class="btn btn-sm btn-danger" onclick="delArticle(${a.id})">删除</button></td>
    </tr>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-head">
        <input type="text" placeholder="搜索标题" value="${escapeHtml(search)}"
               style="max-width:260px" onkeydown="if(event.key==='Enter')PAGES.articles(1,this.value)">
        <div class="text-sm muted">共 ${d.total} 条</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>标题</th><th>所属用户</th><th>总结</th><th>处理时间</th><th>操作</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="5"><div class="empty"><p>暂无数据</p></div></td></tr>'}</tbody>
        </table>
      </div>
      ${pager(d, (p) => PAGES.articles(p, STATE.page.articles.search))}
    </div>
  `;
};

async function delArticle(id) {
  if (!confirm('确定删除该文章记录？')) return;
  const r = await API.del(`/api/admin/articles/${id}`);
  ok(r.message);
  render();
}

/* ═══ 任务队列 ═══ */

PAGES.jobs = async (page = 1, status = '') => {
  STATE.page.jobs = { page, status };
  const d = await API.get(`/api/admin/jobs?page=${page}&page_size=20&status=${status}`);

  const STATUS_MAP = {
    pending: ['badge-gray', '排队'],
    running: ['badge-blue', '执行中'],
    done: ['badge-green', '完成'],
    error: ['badge-red', '失败'],
    canceled: ['badge-gray', '已取消'],
  };

  const rows = d.items.map(j => {
    const [cls, label] = STATUS_MAP[j.status] || ['badge-gray', j.status];
    return `
    <tr>
      <td class="mono text-sm">#${j.id}</td>
      <td class="text-sm">${escapeHtml(j.type_label)}</td>
      <td class="text-sm">${escapeHtml(j.username)}</td>
      <td><span class="badge ${cls}">${label}</span></td>
      <td class="text-xs mono">${escapeHtml(j.stage || '—')}</td>
      <td class="text-xs muted">${j.created_at}</td>
      <td class="text-xs" style="max-width:220px">
        ${j.error ? `<span style="color:var(--red-500)">${escapeHtml(j.error.slice(0, 90))}</span>` : '—'}
      </td>
      <td><button class="btn btn-sm btn-danger" onclick="delJob(${j.id})">删除</button></td>
    </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="tab-bar mb-2">
        ${['', 'running', 'pending', 'done', 'error'].map(s => `
          <button class="btn btn-sm ${status === s ? 'btn-primary' : ''}"
                  onclick="PAGES.jobs(1,'${s}')">${s === '' ? '全部' : STATUS_MAP[s] ? STATUS_MAP[s][1] : s}</button>
        `).join('')}
        <button class="btn btn-sm" onclick="requeue()">重排失败任务</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>类型</th><th>用户</th><th>状态</th><th>阶段</th><th>创建</th><th>错误</th><th>操作</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="8"><div class="empty"><p>暂无任务</p></div></td></tr>'}</tbody>
        </table>
      </div>
      ${pager(d, (p) => PAGES.jobs(p, STATE.page.jobs.status))}
    </div>
  `;
};

async function delJob(id) {
  if (!confirm('确定删除该任务记录？')) return;
  await API.del(`/api/admin/jobs/${id}`);
  ok('已删除');
  render();
}

/* ═══ 用量统计 ═══ */

PAGES.usage = async () => {
  const d = await API.get('/api/admin/usage');

  const rows = d.items.map(u => `
    <tr>
      <td class="text-sm" style="font-weight:500">${escapeHtml(u.username)}</td>
      <td class="text-sm">${u.summary_count}</td>
      <td class="text-sm mono">${(u.ai_tokens || 0).toLocaleString()}</td>
      <td><button class="btn btn-sm" onclick="showUserUsage(${u.user_id}, '${escapeHtml(u.username)}')">历史</button></td>
    </tr>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="dot"></span> ${d.year_month} 用量明细</div>
      </div>
      <div class="card-desc">
        DeepSeek 的 token 用量以服务商账单为准，这里统计的是本站自己的记账。
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>用户</th><th>总结次数</th><th>AI Tokens</th><th>操作</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="4"><div class="empty"><p>本月暂无用量</p></div></td></tr>'}</tbody>
        </table>
      </div>
    </div>
  `;
};

async function showUserUsage(userId, username) {
  const d = await API.get(`/api/admin/users/${userId}/usage`);
  const rows = d.items.map(r => `
    <tr>
      <td class="text-sm mono">${r.year_month}</td>
      <td class="text-sm">${r.summary_count}</td>
      <td class="text-sm mono">${(r.ai_tokens || 0).toLocaleString()}</td>
    </tr>`).join('');

  showModal(`${username} · 历史用量`, `
    <div class="table-wrap">
      <table>
        <thead><tr><th>月份</th><th>总结次数</th><th>AI Tokens</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="3"><div class="empty"><p>暂无记录</p></div></td></tr>'}</tbody>
      </table>
    </div>
    <button class="btn btn-sm mt-2" onclick="cleanupAudio()">清理残留音频文件</button>
  `, null, '关闭');
}

async function cleanupAudio() {
  try {
    const r = await API.post('/api/admin/maintenance/cleanup-asr-audio', {});
    toast(r.message, r.ok ? 'ok' : 'err');
  } catch (ex) { err(ex.message); }
}

/* ═══ 分页 ═══ */

function pager(d, onGo) {
  if (d.total <= d.page_size) return '';
  const totalPages = Math.ceil(d.total / d.page_size);
  return `
    <div class="row-between mt-2">
      <div class="text-sm muted">第 ${d.page} / ${totalPages} 页，共 ${d.total} 条</div>
      <div class="row">
        <button class="btn btn-sm" ${d.page <= 1 ? 'disabled' : ''}
                onclick="__goPage(${d.page - 1})">上一页</button>
        <button class="btn btn-sm" ${!d.has_more ? 'disabled' : ''}
                onclick="__goPage(${d.page + 1})">下一页</button>
      </div>
    </div>`;
}

let __pagerFn = null;
function __setPager(fn) { __pagerFn = fn; }
function __goPage(p) { if (__pagerFn) __pagerFn(p); }

/* ═══ 弹窗 ═══ */

let __modalConfirm = null;

function showModal(title, bodyHtml, onConfirm, closeText = '取消', opts = null) {
  __modalConfirm = onConfirm;
  // opts 可选：{ wide: 宽版, fill: 只让正文滚动（标题栏/按钮常驻） }
  // 不传时行为与旧版完全一致，其余调用点无需改动
  const o = opts || {};
  const cls = ['modal', o.wide ? 'modal-wide' : '', o.fill ? 'modal-fill' : '']
    .filter(Boolean).join(' ');
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-mask" onclick="if(event.target===this)closeModal()">
      <div class="${cls}">
        <div class="modal-head">
          <span>${escapeHtml(title)}</span>
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-foot">
          ${onConfirm ? `<button class="btn" onclick="closeModal()">取消</button>
                         <button class="btn btn-primary" onclick="confirmModal()">确定</button>`
                      : `<button class="btn btn-primary" onclick="closeModal()">${escapeHtml(closeText)}</button>`}
        </div>
      </div>
    </div>`;
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  __modalConfirm = null;
}

async function confirmModal() {
  if (!__modalConfirm) return closeModal();
  try {
    const keep = await __modalConfirm();
    if (keep !== true) { closeModal(); render(); }
  } catch (ex) {
    err(ex.message);
  }
}

/* ═══ 启动 ═══ */

(async function init() {
  try {
    const me = await API.get('/api/auth/me');
    ME = me.user;

    if (ME.role !== 'admin') {
      location.href = '/';
      return;
    }

    document.getElementById('whoami').textContent = ME.display_name;

    const hash = location.hash.replace('#', '');
    go(TITLES[hash] ? hash : 'overview');
  } catch (ex) {
    location.href = '/login?next=' + encodeURIComponent('/admin');
  }
})();
</script>
